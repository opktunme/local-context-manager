[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-context-manager"
version = "0.1.0"
description = "A local-only context runtime and debugger for local LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Local Context Manager contributors" }]
keywords = ["local-llm", "context-window", "openai-compatible", "fastapi", "react"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/opktunme/local-context-manager"
Repository = "https://github.com/opktunme/local-context-manager"
Issues = "https://github.com/opktunme/local-context-manager/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PIE", "FURB"]
ignore = ["E501"]
